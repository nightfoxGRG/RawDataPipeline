<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2188c8"/>
      <stop offset="1" stop-color="#155a8a"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square app icon background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Incoming data dots -->
  <g fill="#ffffff">
    <circle cx="380" cy="190" r="24"/>
    <circle cx="450" cy="260" r="24"/>
    <circle cx="512" cy="160" r="24"/>
    <circle cx="574" cy="260" r="24"/>
    <circle cx="644" cy="190" r="24"/>
  </g>

  <!-- Chevron arrow flowing down into the database -->
  <path d="M 360 370 L 512 540 L 664 370"
        fill="none"
        stroke="#ffffff"
        stroke-width="44"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Database cylinder body -->
  <g fill="#ffffff">
    <ellipse cx="512" cy="600" rx="232" ry="58"/>
    <rect x="280" y="600" width="464" height="240"/>
    <ellipse cx="512" cy="840" rx="232" ry="58"/>
  </g>

  <!-- Front rim of the top disc (3D feel) -->
  <path d="M 280 600 A 232 58 0 0 1 744 600"
        fill="none"
        stroke="#1a6fa8"
        stroke-width="5"
        opacity="0.4"/>

  <!-- Internal disc separators -->
  <path d="M 280 680 A 232 58 0 0 1 744 680"
        fill="none"
        stroke="#1a6fa8"
        stroke-width="5"
        opacity="0.3"/>
  <path d="M 280 760 A 232 58 0 0 1 744 760"
        fill="none"
        stroke="#1a6fa8"
        stroke-width="5"
        opacity="0.3"/>
</svg>
