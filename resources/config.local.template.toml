# config.local.template.toml
# Шаблон локального конфигурационного файла для local-сборки.
# При первом запуске копируется в ~/.config/RawDataPipeline/config.local.toml
# (или %APPDATA%\RawDataPipeline\config.local.toml на Windows).
# Можно отредактировать в текстовом редакторе или через onboarding-форму.

[database]
host     = "localhost"
port     = 5432
name     = "raw_data_pipeline"
user     = ""
password = ""

[keycloak]
client_secret = ""
